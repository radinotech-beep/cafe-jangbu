      <button class="mtab" onclick="switchDBTab('dessert')">디저트</button>

    <div class="mbody" id="dbBody"></div>
    <div class="mfoot">
      <button class="btn-c" onclick="closeDB()">닫기</button>
      <button class="btn-s" onclick="saveDB()">저장</button>
    </div>
  </div>
</div>

    <div class="mhead"><h2>부서 추가</h2><button class="mclose" onclick="closeDM()">&#10005;</button></div>
    <div style="padding:14px;">
      <div style="font-size:12px;color:#888780;">부서명을 입력하세요</div>
      <input type="text" id="newDept" placeholder="예: 기획예산팀" onkeydown="if(event.key==='Enter')addDept()">
    </div>
    <div class="mfoot">
      <button class="btn-c" onclick="closeDM()">취소</button>
      <button class="btn-s" onclick="addDept()">추가</button>
    </div>
  </div>
</div>

// ── Firebase 저장 (디바운스 1.5초) ──
function sv(){
  setSyncStatus('ing');
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>{
    const data={depts,menuDB,optionDB,dessertDB};
    db.ref('jangbu').set(data)
      .then(()=>setSyncStatus('ok'))
      .catch(()=>setSyncStatus('err'));
  },1500);
}

// ── Firebase 로드 ──
function loadFromFirebase(){
  db.ref('jangbu').once('value').then(snap=>{
    const data=snap.val();
    if(data){
      depts=data.depts||[];
      menuDB=data.menuDB||[...defaultMenu];
      optionDB=data.optionDB||[...defaultOpt];
      dessertDB=data.dessertDB||[...defaultDes];
    } else {
      depts=[];
      menuDB=[...defaultMenu];
      optionDB=[...defaultOpt];
      dessertDB=[...defaultDes];
    }
    setSyncStatus('ok');
    initUI();
  }).catch(e=>{
    console.error(e);
    setSyncStatus('err');
    depts=[];menuDB=[...defaultMenu];optionDB=[...defaultOpt];dessertDB=[...defaultDes];
    initUI();
  });
}

// 실시간 변경 감지 (다른 기기에서 수정 시 자동 반영)
function listenRealtime(){
  db.ref('jangbu').on('value',snap=>{
    const data=snap.val();
    if(!data)return;
    depts=data.depts||[];
    menuDB=data.menuDB||[...defaultMenu];
    optionDB=data.optionDB||[...defaultOpt];
    dessertDB=data.dessertDB||[...defaultDes];
    setSyncStatus('ok');
    const prevTab=curTab;
    renderPages();
    depts.forEach((_,i)=>renderRows(i));
    renderTabs();
    if(prevTab==='status')renderStatus();
    else if(typeof prevTab==='number'&&prevTab<depts.length){
      document.getElementById('page-'+prevTab)&&document.getElementById('page-'+prevTab).classList.add('active');
    }
  });
}

function norm(s){
  if(!s)return'';
  let r=s.replace(/\s/g,'').toLowerCase();
  if(!r.includes('아메리카노')&&!r.includes('아아')&&!r.includes('뜨아')&&!r.includes('디카뜨아')&&!r.includes('디카아아')){
    r=r.replace(/\(hot\)/g,'').replace(/\(ice\)/g,'');
  }
  return r;
}
function search(q){
  if(!q)return[];
  const nq=norm(q);
  const all=[...menuDB,...dessertDB];
  const seen=new Map();const res=[];
  for(const item of all){
    const nn=norm(item.name);
    const als=(item.alias||'').split(';').map(a=>norm(a)).filter(Boolean);
    if(nn.includes(nq)||als.some(a=>a.includes(nq))){
      const key=norm(item.name).replace(/\(hot\)/g,'').replace(/\(ice\)/g,'');
      if(!seen.has(key)){seen.set(key,true);res.push(item);}
    }
  }
  return res.slice(0,10);
}

function renderTabs(){
  const bar=document.getElementById('tabBar');
  bar.innerHTML='';
  depts.forEach((d,i)=>{
    const b=document.createElement('button');
    b.className='tab'+(curTab===i?' active':'');
    b.textContent=d.name;b.onclick=()=>sw(i);
    bar.appendChild(b);
  });
  const sep=document.createElement('div');sep.className='tab-sep';bar.appendChild(sep);
  const sb=document.createElement('button');
  sb.className='tab status-tab'+(curTab==='status'?' active':'');
  sb.textContent='부서현황';sb.onclick=()=>sw('status');
  bar.appendChild(sb);
}

function sw(idx){
  curTab=idx;renderTabs();
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  if(idx==='status'){document.getElementById('page-status').classList.add('active');renderStatus();}
  else{const pg=document.getElementById('page-'+idx);if(pg){pg.classList.add('active');calcBal(idx);}}
  hideAC();hideOpt();
}

function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');}
function pn(s){const n=parseInt(String(s||'').replace(/,/g,'').replace(/[^0-9\-]/g,''));return isNaN(n)?0:n;}

function ensureRows(di){
  while(depts[di].rows.length<ROWS)depts[di].rows.push({date:'',content:'',opts:[],order:'',pay:'',note:''});
}

function renderRows(di){
  const tb=document.getElementById('tbody-'+di);if(!tb)return;
  ensureRows(di);
  tb.innerHTML='';
  depts[di].rows.forEach((row,ri)=>tb.appendChild(makeRow(di,ri)));
  calcBal(di);
}

function makeRow(di,ri){
  const row=depts[di].rows[ri];
  const tr=document.createElement('tr');
  tr.id=`tr-${di}-${ri}`;
  const tdDel=document.createElement('td');tdDel.className='del-cell';
  const delBtn=document.createElement('button');delBtn.className='del-btn';delBtn.textContent='×';
  delBtn.onclick=()=>deleteRow(di,ri);
  tdDel.appendChild(delBtn);tr.appendChild(tdDel);
  const tdN=document.createElement('td');tdN.className='rn';tdN.textContent=ri+1;tr.appendChild(tdN);
  tr.appendChild(makeInputTd(di,ri,'date',row.date,'center'));
  tr.appendChild(makeContentTd(di,ri,row.content));
  tr.appendChild(makeOptTd(di,ri,row.opts||[]));
  tr.appendChild(makeInputTd(di,ri,'pay',row.pay,'right'));
  tr.appendChild(makeOrderTd(di,ri,row.order));
  const tdBal=document.createElement('td');tdBal.id=`bl-${di}-${ri}`;tdBal.style.cssText='text-align:right;padding:6px 6px;background:#fafaf8;font-size:12px;';tr.appendChild(tdBal);
  tr.appendChild(makeInputTd(di,ri,'note',row.note,'left'));
  return tr;
}

function makeInputTd(di,ri,col,val,align){
  const td=document.createElement('td');
  const inp=document.createElement('input');
  inp.type='text';inp.value=val||'';inp.style.textAlign=align;
  inp.dataset.di=di;inp.dataset.ri=ri;inp.dataset.col=col;
  inp.addEventListener('change',()=>cc(inp));
  inp.addEventListener('keydown',e=>navKey(e,di,ri,col));
  inp.addEventListener('paste',e=>handlePaste(e,di,ri,col));
  td.appendChild(inp);return td;
}

function makeOrderTd(di,ri,val){
  const td=document.createElement('td');
  const inp=document.createElement('input');
  inp.type='text';inp.value=val||'';inp.style.textAlign='right';
  inp.dataset.di=di;inp.dataset.ri=ri;inp.dataset.col='order';
  inp.id=`or-inp-${di}-${ri}`;
  inp.addEventListener('change',()=>{
    const di2=+inp.dataset.di,ri2=+inp.dataset.ri;
    depts[di2].rows[ri2].order=inp.value.trim();
    depts[di2].rows[ri2].basePrice=pn(inp.value);
    calcBal(di2);sv();
  });
  inp.addEventListener('keydown',e=>navKey(e,di,ri,'order'));
  inp.addEventListener('paste',e=>handlePaste(e,di,ri,'order'));
  td.appendChild(inp);return td;
}

function makeContentTd(di,ri,val){
  const td=document.createElement('td');td.style.position='relative';
  const inp=document.createElement('input');
  inp.type='text';inp.value=val||'';
  inp.dataset.di=di;inp.dataset.ri=ri;inp.dataset.col='content';
  inp.addEventListener('input',()=>ci(inp));
  inp.addEventListener('change',()=>cc(inp));
  inp.addEventListener('keydown',e=>{ak(e,inp);navKey(e,di,ri,'content');});
  inp.addEventListener('paste',e=>handlePaste(e,di,ri,'content'));
  td.appendChild(inp);return td;
}

function makeOptTd(di,ri,opts){
  const td=document.createElement('td');td.className='opt-cell';td.id=`opt-td-${di}-${ri}`;
  const btn=document.createElement('button');
  btn.className='opt-trigger'+(opts&&opts.length>0?' has-opt':'');
  btn.textContent=optLabel(opts);
  btn.onclick=(e)=>{e.stopPropagation();openOptPop(di,ri,btn);};
  td.appendChild(btn);return td;
}

function optLabel(opts){
  if(!opts||opts.length===0)return '+ 옵션';
  return opts.map(o=>o.name).join(', ');
}

function cc(inp){
  const di=+inp.dataset.di,ri=+inp.dataset.ri,col=inp.dataset.col;
  depts[di].rows[ri][col]=inp.value.trim();
  if(col==='pay')calcBal(di);
  sv();
}

function deleteRow(di,ri){
  depts[di].rows.splice(ri,1);
  ensureRows(di);renderRows(di);sv();
}

function ci(inp){
  const q=inp.value.trim();
  acList=search(q);acIdx=-1;
  if(acList.length>0&&q.length>0)showAC(inp,+inp.dataset.di,+inp.dataset.ri);
  else hideAC();
}

function showAC(inp,di,ri){
  acTarget=inp;
  const pop=document.getElementById('acPop');
  const r=inp.getBoundingClientRect();
  pop.style.left=r.left+'px';pop.style.top=(r.bottom+2)+'px';
  pop.style.minWidth=Math.max(r.width,230)+'px';
  pop.innerHTML=acList.map((item,i)=>`<div class="ac-item" data-i="${i}"><span>${esc(item.name)}</span><span class="ac-price">${item.price.toLocaleString()}원</span></div>`).join('');
  pop.querySelectorAll('.ac-item').forEach((el,i)=>{el.onmousedown=()=>pa(i,di,ri);});
  pop.style.display='block';
}

function hideAC(){document.getElementById('acPop').style.display='none';acList=[];acIdx=-1;acTarget=null;}

function pa(i,di,ri){
  const item=acList[i];
  const inp=document.querySelector(`input[data-di="${di}"][data-ri="${ri}"][data-col="content"]`);
  if(inp)inp.value=item.name;
  depts[di].rows[ri].content=item.name;
  depts[di].rows[ri].basePrice=item.price;
  depts[di].rows[ri].order=item.price;
  applyOrderWithOpts(di,ri);
  hideAC();calcBal(di);sv();
  const pi=document.querySelector(`input[data-di="${di}"][data-ri="${ri}"][data-col="pay"]`);
  if(pi)setTimeout(()=>pi.focus(),10);
}

function applyOrderWithOpts(di,ri){
  const row=depts[di].rows[ri];
  const base=row.basePrice||pn(row.order);
  const optTotal=(row.opts||[]).reduce((s,o)=>s+o.price,0);
  const total=base+optTotal;
  row.order=total;
  const oInp=document.getElementById(`or-inp-${di}-${ri}`);
  if(oInp)oInp.value=total?total.toLocaleString():'';
  const optTd=document.getElementById(`opt-td-${di}-${ri}`);
  if(optTd){
    const btn=optTd.querySelector('.opt-trigger');
    if(btn){btn.textContent=optLabel(row.opts);btn.className='opt-trigger'+(row.opts&&row.opts.length>0?' has-opt':'');}
  }
}

function ak(e,inp){
  const pop=document.getElementById('acPop');
  if(pop.style.display==='none')return;
  const items=pop.querySelectorAll('.ac-item');
  if(e.key==='ArrowDown'){e.preventDefault();acIdx=Math.min(acIdx+1,items.length-1);items.forEach((el,i)=>el.classList.toggle('sel',i===acIdx));}
  else if(e.key==='ArrowUp'){e.preventDefault();acIdx=Math.max(acIdx-1,0);items.forEach((el,i)=>el.classList.toggle('sel',i===acIdx));}
  else if(e.key==='Enter'){
    if(acIdx>=0){e.preventDefault();pa(acIdx,+inp.dataset.di,+inp.dataset.ri);}
    else if(acList.length===1){e.preventDefault();pa(0,+inp.dataset.di,+inp.dataset.ri);}
  }
  else if(e.key==='Escape')hideAC();
}

function openOptPop(di,ri,btn){
  optTarget={di,ri};
  const row=depts[di].rows[ri];
  const pop=document.getElementById('optPop');
  const list=document.getElementById('optList');
  const selectedNames=(row.opts||[]).map(o=>o.name);
  list.innerHTML=optionDB.map((opt,i)=>`
    <div class="opt-item${selectedNames.includes(opt.name)?' checked':''}" onclick="toggleOpt(${i})">
      <span class="opt-name">${esc(opt.name)}</span>
      <span class="opt-item-price">+${opt.price.toLocaleString()}원</span>
    </div>`).join('');
  const r=btn.getBoundingClientRect();
  pop.style.left=r.left+'px';pop.style.top=(r.bottom+2)+'px';
  pop.style.display='block';
}

function toggleOpt(i){
  if(!optTarget)return;
  const {di,ri}=optTarget;
  const row=depts[di].rows[ri];
  if(!row.opts)row.opts=[];
  const opt=optionDB[i];
  const idx=row.opts.findIndex(o=>o.name===opt.name);
  if(idx>=0)row.opts.splice(idx,1);
  else row.opts.push({name:opt.name,price:opt.price});
  const items=document.getElementById('optList').querySelectorAll('.opt-item');
  const selectedNames=row.opts.map(o=>o.name);
  items.forEach((el,j)=>el.classList.toggle('checked',selectedNames.includes(optionDB[j].name)));
  if(!row.basePrice)row.basePrice=pn(row.order);
  applyOrderWithOpts(di,ri);
  calcBal(di);sv();
}

function clearOpts(){
  if(!optTarget)return;
  const {di,ri}=optTarget;
  const row=depts[di].rows[ri];
  row.opts=[];
  if(row.basePrice!==undefined)row.order=row.basePrice;
  applyOrderWithOpts(di,ri);
  hideOpt();calcBal(di);sv();
}

function hideOpt(){document.getElementById('optPop').style.display='none';optTarget=null;}

function navKey(e,di,ri,col){
  if(e.key==='Enter'&&document.getElementById('acPop').style.display==='none'){
    e.preventDefault();
    const nextRi=ri+1;
    if(nextRi<depts[di].rows.length){
      const next=document.querySelector(`input[data-di="${di}"][data-ri="${nextRi}"][data-col="${col}"]`);
      if(next)next.focus();
    }
  }
}

function handlePaste(e,di,ri,col){
  const txt=e.clipboardData.getData('text');
  if(!txt.includes('\n')&&!txt.includes('\t'))return;
  e.preventDefault();
  const rows=txt.split('\n').map(r=>r.split('\t'));
  const colOrder=['date','content','pay','order','note'];
  const startCol=colOrder.indexOf(col);
  if(startCol<0)return;
  rows.forEach((cells,rOff)=>{
    const targetRi=ri+rOff;
    if(targetRi>=depts[di].rows.length)return;
    cells.forEach((val,cOff)=>{
      const targetCol=colOrder[startCol+cOff];
      if(!targetCol)return;
      const v=val.trim().replace(/\r/g,'');
      depts[di].rows[targetRi][targetCol]=v;
      const inp=document.querySelector(`input[data-di="${di}"][data-ri="${targetRi}"][data-col="${targetCol}"]`);
      if(inp)inp.value=v;
    });
  });
  calcBal(di);sv();
}

function calcBal(di){
  const d=depts[di];let run=0,tp=0,to=0;
  d.rows.forEach((row,ri)=>{
    const pay=pn(row.pay),order=pn(row.order);
    run+=pay-order;tp+=pay;to+=order;
    const bc=document.getElementById(`bl-${di}-${ri}`);
    if(bc){
      const empty=pay===0&&order===0&&!row.content&&!row.date;
      if(empty){bc.textContent='';bc.style.color='';return;}
      bc.textContent=run.toLocaleString();
      bc.style.color=run<0?'#A32D2D':run>0?'#3B6D11':'#2C2C2A';
    }
  });
  const bal=tp-to;
  const sp=document.getElementById(`sp-${di}`);
  const so=document.getElementById(`so-${di}`);
  const sb=document.getElementById(`sb-${di}`);
  const bg=document.getElementById(`badge-${di}`);
  if(sp)sp.textContent=tp.toLocaleString()+'원';
  if(so)so.textContent=to.toLocaleString()+'원';
  if(sb){sb.textContent=bal.toLocaleString()+'원';sb.style.color=bal<0?'#A32D2D':bal>0?'#3B6D11':'#2C2C2A';}
  if(bg){bg.textContent='현재잔액 '+bal.toLocaleString()+'원';bg.className='bal-badge '+(bal<0?'neg-b':bal>0?'pos-b':'zero-b');}
}

function changeMonth(d){curMonth.setMonth(curMonth.getMonth()+d);renderStatus();}
function mStr(d){return d.getFullYear()+'년 '+(d.getMonth()+1)+'월';}

function inMonth(ds,m){
  if(!ds)return false;
  const s=ds.replace(/\s/g,'');
  const yr=m.getFullYear(),mo=m.getMonth()+1;
  let mm=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);if(mm)return+mm[1]===yr&&+mm[2]===mo;
  mm=s.match(/^(\d{1,2})\/(\d{1,2})$/);if(mm)return+mm[1]===mo;
  mm=s.match(/^(\d{1,2})월/);if(mm)return+mm[1]===mo;
  return false;
}

function renderStatus(){
  document.getElementById('mlabel').textContent=mStr(curMonth);
  const tb=document.getElementById('stBody');tb.innerHTML='';
  let tPrev=0,tOrd=0,tPay=0,tBal=0;
  depts.forEach((d,i)=>{
    let prev=0,mOrd=0,mPay=0;const pdates=[];
    d.rows.forEach(row=>{
      const pay=pn(row.pay),order=pn(row.order);
      if(!inMonth(row.date,curMonth)){prev+=pay-order;}
      else{mOrd+=order;mPay+=pay;if(pay>0&&row.date)pdates.push(row.date.trim());}
    });
    const cur=prev+mPay-mOrd;
    tPrev+=prev;tOrd+=mOrd;tPay+=mPay;tBal+=cur;
    const tr=document.createElement('tr');
    tr.innerHTML=`<td class="no">${i+1}</td><td class="nm">${esc(d.name)}</td>
      <td class="${prev<0?'neg':prev>0?'pos':''}">${prev.toLocaleString()}</td>
      <td>${mOrd.toLocaleString()}</td><td>${mPay.toLocaleString()}</td>
      <td class="nt">${pdates.join(', ')||'-'}</td>
      <td class="${cur<0?'neg':cur>0?'pos':''}">${cur.toLocaleString()}</td>
      <td class="nt"></td>`;
    tb.appendChild(tr);
  });
  const tr=document.createElement('tr');tr.className='tot';
  tr.innerHTML=`<td class="no"></td><td class="nm">합계</td>
    <td class="${tPrev<0?'neg':tPrev>0?'pos':''}">${tPrev.toLocaleString()}</td>
    <td>${tOrd.toLocaleString()}</td><td>${tPay.toLocaleString()}</td><td></td>
    <td class="${tBal<0?'neg':tBal>0?'pos':''}">${tBal.toLocaleString()}</td><td></td>`;
  tb.appendChild(tr);
}

function openDB(){document.getElementById('dbModal').classList.add('open');renderDBTab();}
function closeDB(){document.getElementById('dbModal').classList.remove('open');}
function switchDBTab(t){
  curDBTab=t;
  document.querySelectorAll('.mtab').forEach((b,i)=>b.classList.toggle('active',['menu','option','dessert'][i]===t));
  renderDBTab();
}
function getDB(){return curDBTab==='menu'?menuDB:curDBTab==='option'?optionDB:dessertDB;}
function renderDBTab(){
  const db=getDB();
  const col=curDBTab==='dessert'?'디저트명':'메뉴명';
  let h=`<table class="dbt"><thead><tr><th>${col}</th><th>별칭</th><th style="width:70px;">금액</th><th style="width:30px;"></th></tr></thead><tbody>`;
  db.forEach((it,i)=>{
    h+=`<tr>
      <td><input value="${esc(it.name)}" onchange="dbc(${i},'name',this.value)"></td>
      <td><input value="${esc(it.alias||'')}" onchange="dbc(${i},'alias',this.value)"></td>
      <td><input value="${it.price}" onchange="dbc(${i},'price',this.value)" style="text-align:right;width:65px;"></td>
      <td><button class="bdel" onclick="dbd(${i})">✕</button></td></tr>`;
  });
  h+=`</tbody></table><button class="btn-ar" onclick="dba()">+ 항목 추가</button>`;
  document.getElementById('dbBody').innerHTML=h;
}
function dbc(i,col,val){const db=getDB();db[i][col]=col==='price'?(parseInt(val)||0):val;}
function dbd(i){getDB().splice(i,1);renderDBTab();}
function dba(){getDB().push({name:'',alias:'',price:0});renderDBTab();document.getElementById('dbBody').scrollTop=99999;}
function saveDB(){sv();closeDB();}

function openAddDept(){document.getElementById('deptModal').classList.add('open');setTimeout(()=>document.getElementById('newDept').focus(),80);}
function closeDM(){document.getElementById('deptModal').classList.remove('open');document.getElementById('newDept').value='';}
function addDept(){
  const nm=document.getElementById('newDept').value.trim();
  if(!nm)return;
  depts.push({name:nm,rows:[]});sv();
  const ni=depts.length-1;
  renderPages();
  depts.forEach((_,i)=>renderRows(i));
  closeDM();sw(ni);
}

document.addEventListener('click',e=>{
  if(!e.target.closest('#acPop')&&!(e.target.dataset&&e.target.dataset.col==='content'))hideAC();
  if(!e.target.closest('#optPop')&&!e.target.classList.contains('opt-trigger'))hideOpt();
});
window.addEventListener('scroll',()=>{hideAC();hideOpt();},true);

function initUI(){
  renderPages();
  depts.forEach((_,i)=>renderRows(i));
  if(depts.length>0)sw(0);
  else{curTab='status';renderTabs();document.getElementById('page-status').classList.add('active');renderStatus();}
  listenRealtime();
}

loadFromFirebase();
</script>
