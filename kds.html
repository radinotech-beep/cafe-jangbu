<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#F5C800">
<link rel="manifest" href="kds-manifest.json">
<title>MEGA MGC COFFEE · KDS</title>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Noto Sans KR',sans-serif;background:#FFFBE6;color:#2C2C2A;height:100vh;display:flex;flex-direction:column;overflow:hidden;}

/* 탑바 */
.topbar{background:#F5C800;padding:0 14px;height:46px;display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #E0B800;flex-shrink:0;}
.top-logo{font-size:14px;font-weight:500;color:#111;}
.top-right{display:flex;gap:10px;align-items:center;}
.sync-dot{width:8px;height:8px;border-radius:50%;background:#3B6D11;}
.sync-dot.err{background:#E24B4A;}
.top-time{font-size:13px;color:#555;font-weight:500;}
.top-count{background:#111;color:#F5C800;font-size:12px;font-weight:500;padding:3px 12px;border-radius:20px;}
.page-indicator{display:none;background:#FFF9D6;color:#111;border:1px solid #111;font-size:12px;font-weight:800;padding:3px 10px;border-radius:20px;}
.page-indicator.show{display:inline-flex;}
.page-btn{display:none;width:26px;height:26px;border:1px solid #111;border-radius:50%;background:#fff;color:#111;font-size:16px;font-weight:900;line-height:1;cursor:pointer;font-family:inherit;}
.page-btn.show{display:inline-flex;align-items:center;justify-content:center;}
.page-btn:disabled{opacity:.35;cursor:default;}

/* 주문 그리드 */
.order-grid{flex:1;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:1fr;gap:10px;padding:12px;overflow:hidden;align-content:stretch;}
.order-grid::-webkit-scrollbar{width:4px;}
.order-grid::-webkit-scrollbar-thumb{background:#E8D84A;border-radius:2px;}
.order-grid.slide-next .order-card{animation:slideInNext .22s ease-out both;}
.order-grid.slide-prev .order-card{animation:slideInPrev .22s ease-out both;}
@keyframes slideInNext{from{opacity:.35;transform:translateX(42px);}to{opacity:1;transform:translateX(0);}}
@keyframes slideInPrev{from{opacity:.35;transform:translateX(-42px);}to{opacity:1;transform:translateX(0);}}

/* 주문 카드 */
.order-card{background:#fff;border:2px solid #E8D84A;border-radius:10px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 1px 4px rgba(0,0,0,0.06);min-height:0;}
.order-card.urgent{border-color:#E24B4A;animation:pulse 1.5s infinite;}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(226,75,74,0.3);}50%{box-shadow:0 0 0 6px rgba(226,75,74,0);}}
.order-card.done{opacity:0.82;border-color:#ddd;}

.card-head{background:#FFF9D6;padding:9px 10px;border-bottom:1.5px solid #E8D84A;display:flex;justify-content:space-between;align-items:flex-start;}
.card-head.urgent{background:#FCEBEB;border-bottom-color:#E24B4A;}
.card-head.done{background:#f5f5f5;border-bottom-color:#ddd;}
.order-no{font-size:11px;color:#777;margin-bottom:3px;font-weight:800;}
.order-dept{font-size:22px;font-weight:900;color:#111;line-height:1.15;max-width:190px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.head-right{display:flex;flex-direction:column;align-items:flex-end;gap:3px;}
.order-time{font-size:10px;color:#888;}
.urgent-badge{font-size:9px;background:#E24B4A;color:#fff;padding:2px 6px;border-radius:3px;font-weight:500;}

.card-body{padding:8px 10px;flex:1;overflow:auto;}
.menu-item{padding:5px 0;border-bottom:1px solid #FFF0CC;}
.menu-item:last-child{border-bottom:none;}
.menu-row{display:flex;justify-content:space-between;align-items:center;}
.menu-name{font-size:12px;font-weight:500;color:#2C2C2A;flex:1;}
.menu-qty{font-size:13px;font-weight:500;color:#111;margin-left:6px;white-space:nowrap;}
.tag{font-size:9px;font-weight:500;padding:1px 4px;border-radius:3px;margin-left:3px;vertical-align:middle;}
.tag-hot{background:#FCEBEB;color:#A32D2D;}
.tag-ice{background:#E6F1FB;color:#185FA5;}
.tag-mega{background:#F5C800;color:#111;}
.opt-row{margin-top:2px;display:flex;align-items:flex-start;gap:3px;}
.opt-arrow{color:#B8860B;font-size:10px;margin-top:1px;flex-shrink:0;}
.opt-text{font-size:10px;color:#888;line-height:1.4;}

.card-foot{padding:7px 10px;border-top:1px solid #F0E87A;}
.done-btn{width:100%;padding:8px;background:#F5C800;color:#111;border:none;border-radius:6px;font-size:12px;font-weight:500;cursor:pointer;font-family:inherit;}
.done-btn:active{background:#E0B800;}
.done-btn.completed{background:#eee;color:#aaa;cursor:default;}
.elapsed{font-size:10px;color:#888;text-align:center;margin-bottom:4px;}
.elapsed.warn{color:#E24B4A;font-weight:500;}

/* 빈 화면 */
.empty-state{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#B8860B;gap:10px;}
.empty-icon{font-size:48px;}
.empty-text{font-size:14px;color:#888;}

/* 하단 바 */
.bottombar{background:#F5C800;padding:7px 14px;border-top:1px solid #E0B800;display:flex;gap:20px;align-items:center;flex-shrink:0;}
.stat{display:flex;align-items:center;gap:6px;}
.stat-label{font-size:11px;color:#555;}
.stat-val{font-size:13px;font-weight:500;color:#111;}
.stat-val.red{color:#A32D2D;}
.stat-val.green{color:#3B6D11;}

/* 완료 내역 토글 */
.show-done-btn{margin-left:auto;font-size:11px;padding:4px 10px;background:none;border:1px solid #111;border-radius:10px;cursor:pointer;color:#111;font-family:inherit;}

/* 매장/포장 배지 */
.type-badge{font-size:13px;font-weight:900;padding:4px 10px;border-radius:6px;display:inline-flex;align-items:center;gap:5px;margin-top:7px;}
.type-eat{background:#FCE8E6;color:#A32D2D;border:2px solid #E24B4A;}
.type-take{background:#E5F0FF;color:#064F9E;border:2px solid #6BA7E8;}

/* 취소 버튼 */
.cancel-btn{width:100%;padding:6px;background:#fff;color:#E24B4A;border:1.5px solid #E24B4A;border-radius:6px;font-size:11px;font-weight:500;cursor:pointer;font-family:inherit;margin-top:5px;}
.cancel-btn:active{background:#FCEBEB;}
.order-card.cancelled{opacity:0.82;border-color:#ccc;}
.card-head.cancelled{background:#f5f5f5;border-bottom-color:#ccc;}
.history-actions{display:flex;gap:5px;margin-top:4px;}
.history-btn{flex:1;padding:7px 4px;border:none;border-radius:6px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;}
.history-btn.detail{background:#fff;border:1px solid #111;color:#111;}
.history-btn.cancel{background:#E24B4A;color:#fff;}
.history-btn.restore{background:#3B6D11;color:#fff;}
.order-grid.history-mode{grid-template-columns:repeat(6,minmax(120px,1fr));grid-template-rows:auto;gap:8px;padding:12px;align-content:start;overflow-y:auto;}
.history-card{height:74px;background:#fff;border:1px solid #dedbd0;border-radius:8px;padding:9px 10px;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 1px 2px rgba(0,0,0,.04);}
.history-card:hover{border-color:#111;}
.history-card.cancelled{background:#fffafa;border-color:#ead0d0;}
.history-main{min-width:0;}
.history-no{font-size:11px;color:#999;margin-bottom:3px;}
.history-dept{font-size:14px;font-weight:800;color:#222;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.history-meta{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:11px;color:#777;}
.history-status{border-radius:999px;padding:2px 7px;font-size:10px;font-weight:800;white-space:nowrap;}
.history-status.done{background:#eaf4df;color:#2f6d13;}
.history-status.cancelled{background:#f4e7e7;color:#a13030;}
@media(max-width:900px){.order-grid.history-mode{grid-template-columns:repeat(3,minmax(100px,1fr));}}

/* 세부 음료 제조완료 터치 */
.menu-item{padding:5px 0;border-bottom:1px solid #FFF0CC;cursor:pointer;border-radius:4px;transition:background 0.15s;}
.menu-item:last-child{border-bottom:none;}
.menu-item.made{background:#F0F0F0;}
.menu-item.made .menu-name{text-decoration:line-through;color:#aaa;}
.menu-item.made .menu-qty{color:#aaa;}
.menu-item.made .opt-text{color:#ccc;}

/* 날짜 구분선 */
.date-divider{grid-column:1/-1;text-align:center;font-size:12px;font-weight:500;color:#888;padding:8px 0;border-top:1px dashed #E8D84A;margin-top:4px;}
.detail-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:9999;padding:18px;}
.detail-modal{width:min(460px,100%);max-height:88vh;overflow:auto;background:#fff;border:3px solid #111;border-radius:14px;box-shadow:0 18px 40px rgba(0,0,0,.24);}
.detail-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-bottom:2px solid #111;}
.detail-title{font-size:19px;font-weight:900;color:#111;}
.detail-close{width:34px;height:34px;border:2px solid #111;border-radius:50%;background:#fff;font-size:22px;line-height:1;cursor:pointer;}
.detail-body{padding:16px;}
.detail-meta{display:grid;grid-template-columns:88px 1fr;gap:8px 12px;margin-bottom:14px;font-size:14px;}
.detail-label{font-weight:800;color:#555;}
.detail-items{display:flex;flex-direction:column;gap:10px;margin:12px 0;}
.detail-item{border:2px solid #eee;border-radius:10px;padding:10px 12px;}
.detail-item-name{font-size:16px;font-weight:900;color:#111;}
.detail-item-sub{margin-top:4px;font-size:13px;color:#666;}
.detail-action{width:100%;height:48px;border:none;border-radius:12px;color:#fff;font-size:16px;font-weight:900;cursor:pointer;margin-top:12px;}
.detail-action.cancel{background:#e74c3c;}
.detail-action.restore{background:#2e7d32;}
</style>
</head>
<body>

<div class="detail-overlay" id="detailOverlay" onclick="closeDetailOverlay(event)">
  <div class="detail-modal">
    <div class="detail-head" id="detailHead">
      <span class="detail-title" id="detailTitle"></span>
      <button class="detail-close" onclick="document.getElementById('detailOverlay').style.display='none'">×</button>
    </div>
    <div class="detail-body" id="detailBody"></div>
  </div>
</div>

<div class="topbar">
  <span class="top-logo">MEGA MGC COFFEE · KDS v-pn</span>
  <div class="top-right">
    <span class="sync-dot" id="syncDot"></span>
    <span class="top-time" id="topTime"></span>
    <button class="page-btn" id="pagePrevBtn" onclick="moveKdsPage(-1)">‹</button>
    <span class="page-indicator" id="pageIndicator">1/1 페이지</span>
    <button class="page-btn" id="pageNextBtn" onclick="moveKdsPage(1)">›</button>
    <button onclick="playAlert()" style="background:none;border:1px solid #111;border-radius:10px;font-size:11px;padding:3px 8px;cursor:pointer;color:#111;">🔔 테스트</button>
    <span class="top-count" id="topCount">대기 0건</span>
  </div>
</div>

<div class="order-grid" id="orderGrid">
  <div class="empty-state" style="grid-column:1/-1;">
    <div class="empty-icon">☕</div>
    <div class="empty-text">주문을 기다리는 중...</div>
  </div>
</div>

<div class="bottombar">
  <div class="stat"><span class="stat-label">대기</span><span class="stat-val" id="statPending">0건</span></div>
  <div class="stat"><span class="stat-label">완료</span><span class="stat-val green" id="statDone">0건</span></div>
  <div class="stat"><span class="stat-label">5분초과</span><span class="stat-val red" id="statUrgent">0건</span></div>
  <button class="show-done-btn" onclick="toggleDone()" id="showDoneBtn">완료/취소 내역 보기</button>
</div>

<script>
const firebaseConfig={
  apiKey:"AIzaSyBKvoTCTV0F1W9OukvbqbxLhMW6Y3jZmzc",
  authDomain:"cafe-jangbu.firebaseapp.com",
  projectId:"cafe-jangbu",
  storageBucket:"cafe-jangbu.firebasestorage.app",
  messagingSenderId:"570502999010",
  appId:"1:570502999010:web:207c71a8d8e77d8034a7bb",
  databaseURL:"https://cafe-jangbu-default-rtdb.firebaseio.com"
};
firebase.initializeApp(firebaseConfig);
const db=firebase.database();

let orders={};
let showDone=false;
let kdsPage=0;
const KDS_PAGE_SIZE=4;
let kdsPageAnim='';
let audioCtx=null;
let knownOrderIds=new Set();
let madeItems={}; // {orderId_itemIdx: true} 제조완료 로컬 상태

// ── 오늘+어제 주문만 보관 ──
function cleanOldOrders(){
  const todayStart=new Date();
  todayStart.setHours(0,0,0,0);
  const cutoff=todayStart.getTime()-24*60*60*1000; // 어제 0시 이전 삭제
  db.ref('orders').once('value').then(snap=>{
    const all=snap.val()||{};
    Object.entries(all).forEach(([key,order])=>{
      if(order.createdAt<cutoff){
        db.ref('orders/'+key).remove();
      }
    });
  });
}
// 앱 시작 시 + 매 시간마다 정리
cleanOldOrders();
setInterval(cleanOldOrders,60*60*1000);

// ── 장부 연동 — 취소/취소복구 시 금액 반영 ──
function cleanMenuName(name){
  return String(name||'').replace(/^\((HOT|ICE)\)/,'').replace(/\s+(HOT|ICE)$/,'').trim();
}
function ledgerItemName(item){
  const raw=String((item&&item.originalName)||(item&&item.displayName)||(item&&item.name)||'메뉴').trim();
  const temp=String((item&&item.temp)||'').toUpperCase();
  if(temp&&!/^\((HOT|ICE)\)/.test(raw)&&!/\s+(HOT|ICE)$/.test(raw))return '('+temp+')'+raw;
  return raw;
}
function orderDateStr(order){
  const d=new Date(order.createdAt||Date.now());
  return (d.getMonth()+1)+'/'+d.getDate();
}
function orderItems(order){
  const items=order&&order.items?order.items:[];
  return Array.isArray(items)?items:Object.values(items);
}
function pn(s){
  const n=parseInt(String(s||'').replace(/,/g,'').replace(/[^0-9\-]/g,''));
  return isNaN(n)?0:n;
}
function fmt(n){
  return pn(n).toLocaleString()+'원';
}
function itemAmount(item){
  const qty=pn(item.qty)||1;
  const unit=pn(item.unitPrice)||pn(item.price)||pn(item.amount)||0;
  return unit*qty;
}
function sourceOrderKey(order){
  return String(order.id)+'_'+String(order.createdAt||'');
}
function firebaseSafeKey(v){
  return String(v||'unknown').replace(/[.#$/\[\]]/g,'_');
}
function deletedLedgerTokenList(order){
  const orderId=String(order.id);
  const sourceKey=sourceOrderKey(order);
  return [
    'order_'+firebaseSafeKey(orderId),
    'cancel_'+firebaseSafeKey(sourceKey),
    'cancel_order_'+firebaseSafeKey(orderId)
  ];
}
function normDeptName(name){
  return String(name||'').replace(/\s+/g,'').replace(/[·ㆍ\-.]/g,'').trim();
}
function findDeptKey(deptsData,order){
  if(!deptsData)return null;
  const keys=Object.keys(deptsData);
  if(order.deptId){
    const byId=keys.find(k=>String((deptsData[k]||{}).id||'')===String(order.deptId));
    if(byId!==undefined)return byId;
  }
  if(order.deptKey!==undefined&&deptsData[String(order.deptKey)])return String(order.deptKey);
  const idxKey=String(order.deptIdx);
  const deptName=normDeptName(order.deptName);
  const orderId=String(order.id);
  if(deptsData[idxKey]&&(!deptName||normDeptName(deptsData[idxKey].name)===deptName))return idxKey;
  const byName=keys.find(k=>normDeptName((deptsData[k]||{}).name)===deptName);
  if(byName!==undefined)return byName;
  const byLooseName=keys.find(k=>{
    const n=normDeptName((deptsData[k]||{}).name);
    return deptName&&n&&(n.includes(deptName)||deptName.includes(n));
  });
  if(byLooseName!==undefined)return byLooseName;
  const byOrderRow=keys.find(k=>{
    const rows=(deptsData[k]&&deptsData[k].rows)||[];
    const arr=Array.isArray(rows)?rows:Object.values(rows);
    return arr.some(row=>row&&String(row.orderId||'')===orderId);
  });
  if(byOrderRow!==undefined)return byOrderRow;
  return deptsData[idxKey]?idxKey:null;
}
function emptyRow(){
  return {date:'',content:'',opts:[],qty:'',order:'',pay:'',note:'',createdAt:'',updatedAt:''};
}
function makeCancelRows(order,dateStr){
  const orderId=String(order.id);
  const sourceKey=sourceOrderKey(order);
  const rows=orderItems(order).map((item,idx)=>{
    const ledgerName=ledgerItemName(item);
    const amount=itemAmount(item);
    const opts=item.opts||item.options||[];
    const qty=pn(item.qty)||1;
    const optTotal=opts.reduce((s,o)=>s+pn(typeof o==='string'?0:o.price),0);
    const unit=pn(item.basePrice)||Math.max(0,(pn(item.unitPrice)||0)-optTotal);
    return {date:dateStr,content:ledgerName,opts,qty,order:-Math.abs(amount),pay:'',note:'주문취소',createdAt:dateStr,updatedAt:dateStr,basePrice:-Math.abs(unit),orderId:orderId+'-cancel-'+idx,sourceOrderId:orderId,sourceOrderKey:sourceKey,deptId:order.deptId||'',cancelRow:true};
  }).filter(row=>pn(row.order)!==0);
  if(rows.length===0){
    const total=pn(order.totalPrice)||pn(order.total)||0;
    if(total)rows.push({date:dateStr,content:'주문취소 #'+String(order.id).padStart(3,'0'),opts:[],order:-Math.abs(total),pay:'',note:'주문취소',createdAt:dateStr,updatedAt:dateStr,basePrice:-Math.abs(total),orderId:orderId+'-cancel-total',sourceOrderId:orderId,sourceOrderKey:sourceKey,deptId:order.deptId||'',cancelRow:true});
  }
  return rows;
}
function writeCancelRows(deptKey,order,dept){
  const orderId=String(order.id);
  const sourceKey=sourceOrderKey(order);
  const dateStr=orderDateStr(order);
  const cancelRows=makeCancelRows(order,dateStr);
  if(cancelRows.length===0)return Promise.resolve({ok:false,reason:'주문 금액이 0원으로 저장되어 있음'});
  return db.ref('jangbu/depts/'+deptKey+'/rows').once('value').then(snap=>{
    let rows=snap.val()||[];
    if(!Array.isArray(rows))rows=Object.values(rows);
    while(rows.length<80)rows.push(emptyRow());
    const deptId=order.deptId||(dept&&dept.id)||deptKey;
    const globalPath='jangbu/deletedLedgerRows/'+firebaseSafeKey(deptId);
    return Promise.all([
      db.ref(globalPath).once('value'),
      db.ref('jangbu/depts/'+deptKey+'/deletedRows').once('value')
    ]).then(snaps=>{
      const deleted={...(snaps[0].val()||{}),...(snaps[1].val()||{})};
      const tokens=deletedLedgerTokenList(order);
      if(tokens.some(t=>deleted[t])||deleted['cancel:'+sourceKey]||deleted['cancelId:'+orderId+':'+dateStr]||deleted['order:'+orderId]){
        return {ok:true,reason:'사용자가 삭제한 취소 줄이라 재생성하지 않음'};
      }
    rows=rows.filter(row=>!(row&&row.cancelRow&&(String(row.sourceOrderKey||'')===sourceKey||(String(row.sourceOrderId||'')===orderId&&row.date===dateStr))));
    let insertAt=-1;
    rows.forEach((row,idx)=>{
      if(row&&String(row.orderId||'')===orderId&&(!row.date||row.date===dateStr))insertAt=idx;
    });
    if(insertAt>=0)rows.splice(insertAt+1,0,...cancelRows);
    else{
      const emptyIdx=rows.findIndex(r=>!r.content&&!r.date&&!r.pay&&!r.order);
      if(emptyIdx>=0)rows.splice(emptyIdx,0,...cancelRows);
      else rows.push(...cancelRows);
    }
      return db.ref('jangbu/depts/'+deptKey+'/rows').set(rows).then(()=>({ok:true,reason:'취소 줄 추가 완료'}));
    });
  });
}
function markCancelledInLedger(order){
  return db.ref('jangbu/depts').once('value').then(snap=>{
    const deptsData=snap.val()||{};
    const deptKey=findDeptKey(deptsData,order);
    if(deptKey===null)return {ok:false,reason:'장부에 해당 부서가 없음: '+(order.deptName||'부서명 없음')};
    return writeCancelRows(deptKey,order,deptsData[deptKey]||{});
  }).catch(err=>({ok:false,reason:err&&err.message?err.message:String(err)}));
}

function restoreInLedger(order){
  const orderId=String(order.id);
  const sourceKey=sourceOrderKey(order);
  return db.ref('jangbu/depts').once('value').then(snap=>{
    const deptsData=snap.val()||{};
    const deptKey=findDeptKey(deptsData,order);
    if(deptKey===null)return false;
    const dept=deptsData[deptKey]||{};
    let rows=dept.rows||[];
    if(!Array.isArray(rows))rows=Object.values(rows);
    const before=rows.length;
    const dateStr=orderDateStr(order);
    rows=rows.filter(row=>!(row&&row.cancelRow&&(String(row.sourceOrderKey||'')===sourceKey||(String(row.sourceOrderId||'')===orderId&&row.date===dateStr))));
    if(rows.length!==before)return db.ref('jangbu/depts/'+deptKey+'/rows').set(rows).then(()=>true);
    return false;
  }).catch(err=>console.error('장부 취소복구 반영 실패:',err));
}

function getAudioCtx(){
  if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  return audioCtx;
}

function playAlert(){
  try{
    const ctx=getAudioCtx();
    // 카페 벨 딩~동~딩
    const notes=[{freq:1046,start:0,dur:0.2},{freq:784,start:0.25,dur:0.2},{freq:1046,start:0.5,dur:0.35}];
    notes.forEach(n=>{
      const osc=ctx.createOscillator();
      const gain=ctx.createGain();
      osc.connect(gain);gain.connect(ctx.destination);
      osc.type='sine';
      osc.frequency.setValueAtTime(n.freq,ctx.currentTime+n.start);
      gain.gain.setValueAtTime(0,ctx.currentTime+n.start);
      gain.gain.linearRampToValueAtTime(0.4,ctx.currentTime+n.start+0.01);
      gain.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+n.start+n.dur);
      osc.start(ctx.currentTime+n.start);
      osc.stop(ctx.currentTime+n.start+n.dur+0.05);
    });
  }catch(e){console.warn('알림음 재생 실패:',e);}
}

// 시간 표시
function updateTime(){
  const now=new Date();
  const h=String(now.getHours()).padStart(2,'0');
  const m=String(now.getMinutes()).padStart(2,'0');
  document.getElementById('topTime').textContent=h+':'+m;
}
setInterval(updateTime,1000);
updateTime();

// 경과 시간 계산
function getElapsed(createdAt){
  const sec=Math.floor((Date.now()-createdAt)/1000);
  if(sec<60)return sec+'초';
  return Math.floor(sec/60)+'분 '+( sec%60)+'초';
}
function isUrgent(createdAt){
  return (Date.now()-createdAt)>5*60*1000;
}

// Firebase 실시간 감지
function listenOrders(){
  db.ref('orders').on('value',snap=>{
    const newOrders=snap.val()||{};
    document.getElementById('syncDot').className='sync-dot';

    // 새 주문(pending) 감지 → 알림음
    let hasNew=false;
    Object.values(newOrders).forEach(o=>{
      if(o.status==='pending'&&!knownOrderIds.has(o.id)){
        knownOrderIds.add(o.id);
        hasNew=true;
      }
    });
    if(hasNew)playAlert();
    Object.values(newOrders).forEach(o=>{
      if(o.status==='cancelled')markCancelledInLedger(o);
    });

    orders=newOrders;
    renderOrders();
  },()=>{
    document.getElementById('syncDot').className='sync-dot err';
  });
}

// 첫 클릭 시 AudioContext 활성화
document.addEventListener('click',()=>{
  if(!audioCtx){getAudioCtx();}
  else if(audioCtx.state==='suspended')audioCtx.resume();
},{once:false});

// 주문 완료 처리
function completeOrder(id){
  db.ref('orders/'+id+'/status').set('done');
}
// 주문 취소 처리
function cancelOrder(id){
  if(!confirm('주문을 취소할까요? 장부 금액도 함께 복구됩니다.'))return;
  const order=Object.values(orders).find(o=>String(o.id)===String(id));
  const finish=()=>db.ref('orders/'+id+'/status').set('cancelled');
  if(order)markCancelledInLedger(order).then(result=>{
    if(!result||!result.ok)alert('장부 취소 반영 실패: '+(result&&result.reason?result.reason:'원인 확인 불가'));
  }).finally(finish);
  else finish();
}
function cancelCompletedOrder(id){
  if(!confirm('완료된 주문을 취소 처리할까요? 장부 금액도 함께 복구됩니다.'))return;
  const order=Object.values(orders).find(o=>String(o.id)===String(id));
  const finish=()=>{
    document.getElementById('detailOverlay').style.display='none';
    return db.ref('orders/'+id+'/status').set('cancelled');
  };
  if(order)markCancelledInLedger(order).then(result=>{
    if(!result||!result.ok)alert('장부 취소 반영 실패: '+(result&&result.reason?result.reason:'원인 확인 불가'));
  }).finally(finish);
  else finish();
}
function restoreOrder(id){
  if(!confirm('취소된 주문을 복구할까요? 장부 금액도 다시 차감됩니다.'))return;
  const order=Object.values(orders).find(o=>String(o.id)===String(id));
  const finish=()=>{
    document.getElementById('detailOverlay').style.display='none';
    return db.ref('orders/'+id+'/status').set('pending');
  };
  if(order)restoreInLedger(order).then(ok=>{
    if(!ok)alert('삭제할 취소 줄을 찾지 못했습니다.');
  }).finally(finish);
  else finish();
}
// 세부 음료 제조완료 토글
function toggleMade(orderId,itemIdx){
  const key=orderId+'_'+itemIdx;
  if(madeItems[key])delete madeItems[key];
  else madeItems[key]=true;
  // 해당 카드만 업데이트
  renderOrders();
}

// 태그 HTML
function tempTag(temp){
  if(!temp)return'';
  if(temp==='HOT')return'<span class="tag tag-hot">HOT</span>';
  if(temp==='ICE')return'<span class="tag tag-ice">ICE</span>';
  return'';
}
function isMega(name){return /메가|왕/.test(name);}

// 날짜 포맷
function fmtDate(ts){
  const d=new Date(ts);
  return `${d.getMonth()+1}/${d.getDate()}`;
}
function fmtDateFull(ts){
  const d=new Date(ts);
  const days=['일','월','화','수','목','금','토'];
  return `${d.getMonth()+1}월 ${d.getDate()}일 (${days[d.getDay()]})`;
}

// 렌더
function renderOrders(){
  const grid=document.getElementById('orderGrid');
  grid.innerHTML='';
  grid.classList.toggle('history-mode',showDone);
  grid.classList.remove('slide-next','slide-prev');
  if(kdsPageAnim){
    grid.classList.add(kdsPageAnim);
    setTimeout(()=>grid.classList.remove('slide-next','slide-prev'),260);
    kdsPageAnim='';
  }

  const allList=Object.values(orders)
    .filter(o=>showDone?(o.status==='done'||o.status==='cancelled'):o.status==='pending')
    .sort((a,b)=>a.createdAt-b.createdAt);

  // 대기 중인 것도 항상 위에 표시
  const pendingList=Object.values(orders).filter(o=>o.status==='pending').sort((a,b)=>a.createdAt-b.createdAt);
  let list=showDone?allList:pendingList;

  const pending=Object.values(orders).filter(o=>o.status==='pending');
  const done=Object.values(orders).filter(o=>o.status==='done');
  const cancelled=Object.values(orders).filter(o=>o.status==='cancelled');
  const urgent=pending.filter(o=>isUrgent(o.createdAt));

  document.getElementById('topCount').textContent='대기 '+pending.length+'건';
  document.getElementById('statPending').textContent=pending.length+'건';
  document.getElementById('statDone').textContent=done.length+'건';
  document.getElementById('statUrgent').textContent=urgent.length+'건';
  updatePageIndicator(pendingList.length);

  if(list.length===0){
    grid.innerHTML=`<div class="empty-state" style="grid-column:1/-1;">
      <div class="empty-icon">☕</div>
      <div class="empty-text">${showDone?'완료/취소 내역이 없어요':'주문을 기다리는 중...'}</div>
    </div>`;
    return;
  }

  if(!showDone){
    const totalPages=Math.max(1,Math.ceil(pendingList.length/KDS_PAGE_SIZE));
    if(kdsPage>=totalPages)kdsPage=totalPages-1;
    if(kdsPage<0)kdsPage=0;
    const start=kdsPage*KDS_PAGE_SIZE;
    list=pendingList.slice(start,start+KDS_PAGE_SIZE);
    updatePageIndicator(pendingList.length);
  }

  // 날짜별 그룹핑 (완료내역 볼 때)
  let lastDate='';

  list.forEach(order=>{
    const isDone=order.status==='done';
    const isCancelled=order.status==='cancelled';
    const urg=!isDone&&!isCancelled&&isUrgent(order.createdAt);

    // 날짜 구분선 (완료내역 볼 때)
    if(showDone){
      const dateStr=fmtDate(order.createdAt);
      if(dateStr!==lastDate){
        lastDate=dateStr;
        const divider=document.createElement('div');
        divider.className='date-divider';
        divider.textContent='📅 '+fmtDateFull(order.createdAt);
        grid.appendChild(divider);
      }
      renderHistoryCard(grid,order);
      return;
    }

    const card=document.createElement('div');
    card.className='order-card'+(urg?' urgent':isDone?' done':isCancelled?' cancelled':'');

    // ── 헤더 ──
    const headCls='card-head'+(urg?' urgent':isDone?' done':isCancelled?' cancelled':'');
    const time=new Date(order.createdAt);
    const timeStr=String(time.getHours()).padStart(2,'0')+':'+String(time.getMinutes()).padStart(2,'0');
    const isTake=order.orderType==='take';
    const typeBadge=`<span class="type-badge ${isTake?'type-take':'type-eat'}">${isTake?'🛍️ 포장':'🍽️ 매장'}</span>`;

    const headDiv=document.createElement('div');
    headDiv.className=headCls;
    if(showDone){
      headDiv.innerHTML=`
        <div>
          <div class="order-no">#${String(order.id).padStart(3,'0')}</div>
          <div class="order-dept">${esc(order.deptName)}</div>
        </div>
        <div class="head-right">
          ${isCancelled?'<span style="font-size:9px;background:#999;color:#fff;padding:2px 6px;border-radius:3px;font-weight:500;">취소됨</span>':''}
        </div>`;
    }else{
      headDiv.innerHTML=`
        <div>
          <div class="order-no">#${String(order.id).padStart(3,'0')}</div>
          <div class="order-dept">${esc(order.deptName)}</div>
          ${typeBadge}
        </div>
        <div class="head-right">
          ${urg?'<span class="urgent-badge">⚠ 5분초과</span>':''}
          ${isCancelled?'<span style="font-size:9px;background:#999;color:#fff;padding:2px 6px;border-radius:3px;font-weight:500;">취소됨</span>':''}
          <span class="order-time">${timeStr}</span>
        </div>`;
    }
    card.appendChild(headDiv);

    // ── 바디 ──
    if(!showDone){
      const body=document.createElement('div');
      body.className='card-body';
      (order.items||[]).forEach((item,idx)=>{
        const mega=isMega(item.name);
        const optStr=(item.opts||[]).map(o=>o.name).join(', ');
        const madeKey=order.id+'_'+idx;
        const isMade=!!madeItems[madeKey];
        const div=document.createElement('div');
        div.className='menu-item'+(isMade?' made':'');
        if(!isDone&&!isCancelled){
          div.onclick=()=>toggleMade(order.id,idx);
          div.title='터치하면 제조완료 표시';
        }
        div.innerHTML=`
          <div class="menu-row">
            <span class="menu-name">${esc(item.displayName||item.name)}${mega?'<span class="tag tag-mega">MEGA</span>':''}${tempTag(item.temp)}</span>
            <span class="menu-qty">${isMade?'✓':''}x${item.qty}</span>
          </div>
          ${optStr?`<div class="opt-row"><span class="opt-arrow">▶</span><span class="opt-text">${esc(optStr)}</span></div>`:''}`;
        body.appendChild(div);
      });
      card.appendChild(body);
    }

    // ── 푸터 ──
    const foot=document.createElement('div');
    foot.className='card-foot';
    if(!isDone&&!isCancelled){
      const elapsed=document.createElement('div');
      elapsed.className='elapsed'+(urg?' warn':'');
      elapsed.textContent=getElapsed(order.createdAt);
      foot.appendChild(elapsed);

      const btnRow=document.createElement('div');
      btnRow.style.cssText='display:flex;gap:5px;';

      const doneBtn=document.createElement('button');
      doneBtn.className='done-btn';
      doneBtn.style.flex='1';
      doneBtn.textContent='✓ 완료';
      doneBtn.onclick=()=>completeOrder(order.id);
      btnRow.appendChild(doneBtn);

      const cancelBtn=document.createElement('button');
      cancelBtn.className='cancel-btn';
      cancelBtn.style.cssText='flex:0.5;margin-top:0;';
      cancelBtn.textContent='✕ 취소';
      cancelBtn.onclick=(e)=>{e.stopPropagation();cancelOrder(order.id);};
      btnRow.appendChild(cancelBtn);

      foot.appendChild(btnRow);
    } else {
      card.style.cursor='pointer';
      card.onclick=()=>openDetail(order);
      const hint=document.createElement('div');
      hint.className='elapsed';
      hint.textContent='클릭해서 상세 보기';
      foot.appendChild(hint);
    }
    card.appendChild(foot);
    grid.appendChild(card);
  });
}

function renderHistoryCard(grid,order){
  const isCancelled=order.status==='cancelled';
  const time=new Date(order.createdAt||Date.now());
  const timeStr=String(time.getHours()).padStart(2,'0')+':'+String(time.getMinutes()).padStart(2,'0');
  const card=document.createElement('div');
  card.className='history-card'+(isCancelled?' cancelled':' done');
  card.onclick=()=>openDetail(order);
  card.innerHTML=`
    <div class="history-main">
      <div class="history-no">#${String(order.id).padStart(3,'0')}</div>
      <div class="history-dept">${esc(order.deptName||'')}</div>
    </div>
    <div class="history-meta">
      <span class="history-status ${isCancelled?'cancelled':'done'}">${isCancelled?'취소됨':'완료됨'}</span>
      <span>${timeStr}</span>
    </div>`;
  grid.appendChild(card);
}

function updatePageIndicator(totalPending){
  const el=document.getElementById('pageIndicator');
  const prev=document.getElementById('pagePrevBtn');
  const next=document.getElementById('pageNextBtn');
  if(!el)return;
  if(showDone||totalPending<=KDS_PAGE_SIZE){
    el.classList.remove('show');
    if(prev)prev.classList.remove('show');
    if(next)next.classList.remove('show');
    return;
  }
  const totalPages=Math.max(1,Math.ceil(totalPending/KDS_PAGE_SIZE));
  if(kdsPage>=totalPages)kdsPage=totalPages-1;
  if(kdsPage<0)kdsPage=0;
  el.textContent=(kdsPage+1)+'/'+totalPages+' 페이지';
  el.classList.add('show');
  if(prev){
    prev.classList.add('show');
    prev.disabled=kdsPage<=0;
  }
  if(next){
    next.classList.add('show');
    next.disabled=kdsPage>=totalPages-1;
  }
}

function moveKdsPage(delta){
  if(showDone)return;
  const pendingCount=Object.values(orders).filter(o=>o.status==='pending').length;
  const totalPages=Math.max(1,Math.ceil(pendingCount/KDS_PAGE_SIZE));
  const next=Math.max(0,Math.min(totalPages-1,kdsPage+delta));
  if(next===kdsPage)return;
  kdsPageAnim=delta>0?'slide-next':'slide-prev';
  kdsPage=next;
  renderOrders();
}

let swipeStartX=0;
let swipeStartY=0;
const orderGridEl=document.getElementById('orderGrid');
orderGridEl.addEventListener('touchstart',e=>{
  if(!e.touches||!e.touches.length)return;
  swipeStartX=e.touches[0].clientX;
  swipeStartY=e.touches[0].clientY;
},{passive:true});
orderGridEl.addEventListener('touchend',e=>{
  if(!e.changedTouches||!e.changedTouches.length)return;
  const dx=e.changedTouches[0].clientX-swipeStartX;
  const dy=e.changedTouches[0].clientY-swipeStartY;
  if(Math.abs(dx)<70||Math.abs(dx)<Math.abs(dy)*1.4)return;
  moveKdsPage(dx<0?1:-1);
},{passive:true});
orderGridEl.addEventListener('wheel',e=>{
  if(showDone||Math.abs(e.deltaX)<=Math.abs(e.deltaY))return;
  e.preventDefault();
  moveKdsPage(e.deltaX>0?1:-1);
},{passive:false});
orderGridEl.addEventListener('pointerdown',e=>{
  if(e.pointerType==='mouse'&&e.button!==0)return;
  swipeStartX=e.clientX;
  swipeStartY=e.clientY;
});
orderGridEl.addEventListener('pointerup',e=>{
  const dx=e.clientX-swipeStartX;
  const dy=e.clientY-swipeStartY;
  if(Math.abs(dx)<70||Math.abs(dx)<Math.abs(dy)*1.4)return;
  moveKdsPage(dx<0?1:-1);
});

// 경과시간 1초마다 갱신
setInterval(()=>{
  if(showDone)return;
  document.querySelectorAll('.elapsed').forEach(el=>{
    const card=el.closest('.order-card');
    if(!card||card.classList.contains('done')||card.classList.contains('cancelled'))return;
    const id=card.querySelector('.order-no')?.textContent?.replace('#','');
    if(!id)return;
    const order=Object.values(orders).find(o=>String(o.id).padStart(3,'0')===id);
    if(!order)return;
    const urg=isUrgent(order.createdAt);
    el.textContent=getElapsed(order.createdAt);
    el.className='elapsed'+(urg?' warn':'');
    if(urg){card.className='order-card urgent';}
  });
},1000);

function toggleDone(){
  showDone=!showDone;
  kdsPage=0;
  document.getElementById('showDoneBtn').textContent=showDone?'완료/취소 내역 숨기기':'완료/취소 내역 보기';
  renderOrders();
}

function openDetail(order){
  const isTake=order.orderType==='take';
  const isCancelled=order.status==='cancelled';
  const d=new Date(order.createdAt||Date.now());
  const timeStr=(d.getMonth()+1)+'/'+d.getDate()+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
  const title='#'+String(order.id).padStart(3,'0')+' '+esc(order.deptName||'');
  document.getElementById('detailTitle').textContent=title;
  document.getElementById('detailHead').style.background=isCancelled?'#FCE8E8':'#E8F5E8';

  let html='<div class="detail-meta">'
    +'<div class="detail-label">상태</div><div>'+(isCancelled?'취소됨':'완료됨')+'</div>'
    +'<div class="detail-label">구분</div><div>'+(isTake?'Take-out':'부서 주문')+'</div>'
    +'<div class="detail-label">시간</div><div>'+timeStr+'</div>'
    +'<div class="detail-label">금액</div><div>'+fmt(order.totalPrice||order.total||0)+'</div>'
    +'</div>';

  html+='<div class="detail-items">';
  (order.items||[]).forEach(item=>{
    const name=esc(item.displayName||item.name||'메뉴');
    const qty=pn(item.qty)||1;
    const opts=(item.opts||item.options||[]).map(o=>esc(typeof o==='string'?o:o.name)).filter(Boolean).join(', ');
    const amount=(pn(item.unitPrice)||0)*qty;
    html+='<div class="detail-item">'
      +'<div class="detail-item-name">'+name+' × '+qty+'</div>'
      +'<div class="detail-item-sub">'+(opts?opts+' · ':'')+fmt(amount)+'</div>'
      +'</div>';
  });
  html+='</div>';

  if(isCancelled){
    html+='<button class="detail-action restore" onclick="restoreOrder(\''+String(order.id)+'\')">취소 복구하기</button>';
  }else{
    html+='<button class="detail-action cancel" onclick="cancelCompletedOrder(\''+String(order.id)+'\')">완료 주문 취소하기</button>';
  }

  document.getElementById('detailBody').innerHTML=html;
  document.getElementById('detailOverlay').style.display='flex';
}

function closeDetailOverlay(e){
  if(e.target===document.getElementById('detailOverlay')){
    document.getElementById('detailOverlay').style.display='none';
  }
}

function esc(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;');}

listenOrders();
</script>
