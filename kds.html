<script>
const firebaseConfig={
  apiKey:"AIzaSyBKvoTCTV0F1W9OukvbqbxLhMW6Y3jZmzc",
  authDomain:"cafe-jangbu.firebaseapp.com",
  projectId:"cafe-jangbu",
  storageBucket:"cafe-jangbu.firebasestorage.app",
  messagingSenderId:"570502999010",
  appId:"1:570502999010:web:207c71a8d8e77d8034a7bb",
  databaseURL:"https://cafe-jangbu-default-rtdb.firebaseio.com"
};
firebase.initializeApp(firebaseConfig);
const db=firebase.database();

let orders={};
let showDone=false;
let audioCtx=null;
let knownOrderIds=new Set();
let madeItems={}; // {orderId_itemIdx: true} 제조완료 로컬 상태

// ── 하루 지난 주문 자동 삭제 ──
function cleanOldOrders(){
  const cutoff=Date.now()-24*60*60*1000; // 24시간 전
  db.ref('orders').once('value').then(snap=>{
    const all=snap.val()||{};
    Object.entries(all).forEach(([key,order])=>{
      if(order.createdAt<cutoff){
        db.ref('orders/'+key).remove();
      }
    });
  });
}
// 앱 시작 시 + 매 시간마다 정리
cleanOldOrders();
setInterval(cleanOldOrders,60*60*1000);

// ── 장부 연동 — 취소 복구 시 order금액 원복 ──
function restoreInLedger(order){
  const deptId=order.deptId||null;
  const di=order.deptIdx;
  if(!deptId&&(di===undefined||di===null))return;
  const orderId=String(order.id);
  const path=deptId?'jangbu/deptMap/'+deptId+'/rows':'jangbu/depts/'+di+'/rows';
  db.ref(path).once('value').then(snap=>{
    let rows=snap.val()||[];
    if(!Array.isArray(rows))rows=Object.values(rows);
    const today=new Date();
    const dateStr=(today.getMonth()+1)+'/'+(today.getDate());
    let updated=false;
    // orderId로 매칭해서 금액 복구
    for(let i=0;i<rows.length;i++){
      if(rows[i]&&rows[i].orderId===orderId&&rows[i].note==='주문취소'){
        // 원래 금액 복구 (basePrice 활용)
        const origAmt=rows[i].basePrice||rows[i].order||0;
        rows[i]={...rows[i],order:origAmt,note:'',updatedAt:dateStr};
        updated=true;
      }
    }
    if(updated)db.ref(path).set(rows);
  });
}

// ── 장부 연동 — 주문취소 시 order금액 0으로 변경 ──
function markCancelledInLedger(order){
  const deptId=order.deptId||null;
  const di=order.deptIdx;
  if(!deptId&&(di===undefined||di===null))return;
  const orderId=String(order.id);
  const path=deptId?'jangbu/deptMap/'+deptId+'/rows':'jangbu/depts/'+di+'/rows';
  db.ref(path).once('value').then(snap=>{
    let rows=snap.val()||[];
    if(!Array.isArray(rows))rows=Object.values(rows);
    const today=new Date();
    const dateStr=(today.getMonth()+1)+'/'+(today.getDate());
    let updated=false;

    // 1순위: orderId로 정확히 매칭 (주문 저장 시 orderId가 기록된 경우)
    let matchedByOrderId=false;
    for(let i=0;i<rows.length;i++){
      if(rows[i]&&rows[i].orderId===orderId&&rows[i].note!=='주문취소'){
        rows[i]={...rows[i],order:0,note:'주문취소',updatedAt:dateStr};
        updated=true;
        matchedByOrderId=true;
      }
    }

    // 2순위: orderId 없으면 content+날짜로 매칭 (하위 호환)
    if(!matchedByOrderId){
      (order.items||[]).forEach(item=>{
        const ledgerName=(item.originalName||item.displayName||item.name||'')
          .replace(/^\(HOT\)|\(ICE\)/,'').trim();
        for(let i=0;i<rows.length;i++){
          const row=rows[i];
          if(row&&row.date===dateStr&&row.content&&
             row.content.replace(/^\(HOT\)|\(ICE\)/,'').includes(ledgerName)&&
             row.note!=='주문취소'){
            rows[i]={...rows[i],order:0,note:'주문취소',updatedAt:dateStr};
            updated=true;
            break;
          }
        }
      });
    }

    if(updated){
      db.ref('jangbu/depts/'+di+'/rows').set(rows);
    }
  });
}

function getAudioCtx(){
  if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  return audioCtx;
}

function playAlert(){
  try{
    const ctx=getAudioCtx();
    // 카페 벨 딩~동~딩
    const notes=[{freq:1046,start:0,dur:0.2},{freq:784,start:0.25,dur:0.2},{freq:1046,start:0.5,dur:0.35}];
    notes.forEach(n=>{
      const osc=ctx.createOscillator();
      const gain=ctx.createGain();
      osc.connect(gain);gain.connect(ctx.destination);
      osc.type='sine';
      osc.frequency.setValueAtTime(n.freq,ctx.currentTime+n.start);
      gain.gain.setValueAtTime(0,ctx.currentTime+n.start);
      gain.gain.linearRampToValueAtTime(0.4,ctx.currentTime+n.start+0.01);
      gain.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+n.start+n.dur);
      osc.start(ctx.currentTime+n.start);
      osc.stop(ctx.currentTime+n.start+n.dur+0.05);
    });
  }catch(e){console.warn('알림음 재생 실패:',e);}
}

// 시간 표시
function updateTime(){
  const now=new Date();
  const h=String(now.getHours()).padStart(2,'0');
  const m=String(now.getMinutes()).padStart(2,'0');
  document.getElementById('topTime').textContent=h+':'+m;
}
setInterval(updateTime,1000);
updateTime();

// 경과 시간 계산
function getElapsed(createdAt){
  const sec=Math.floor((Date.now()-createdAt)/1000);
  if(sec<60)return sec+'초';
  return Math.floor(sec/60)+'분 '+( sec%60)+'초';
}
function isUrgent(createdAt){
  return (Date.now()-createdAt)>5*60*1000;
}

// Firebase 실시간 감지
function listenOrders(){
  db.ref('orders').on('value',snap=>{
    const newOrders=snap.val()||{};
    document.getElementById('syncDot').className='sync-dot';

    // 새 주문(pending) 감지 → 알림음
    let hasNew=false;
    Object.values(newOrders).forEach(o=>{
      if(o.status==='pending'&&!knownOrderIds.has(o.id)){
        knownOrderIds.add(o.id);
        hasNew=true;
      }
    });
    if(hasNew)playAlert();

    orders=newOrders;
    renderOrders();
  },()=>{
    document.getElementById('syncDot').className='sync-dot err';
  });
}

// 첫 클릭 시 AudioContext 활성화
document.addEventListener('click',()=>{
  if(!audioCtx){getAudioCtx();}
  else if(audioCtx.state==='suspended')audioCtx.resume();
},{once:false});

// 주문 완료 처리
function completeOrder(id){
  db.ref('orders/'+id+'/status').set('done');
}
// 주문 취소 처리
function cancelOrder(id){
  if(!confirm('주문을 취소할까요? 장부에서 금액이 0으로 변경됩니다.'))return;
  const order=Object.values(orders).find(o=>String(o.id)===String(id));
  db.ref('orders/'+id+'/status').set('cancelled');
  if(order)markCancelledInLedger(order);
}
// 취소 복구 — 취소 → 대기
function restoreOrder(id){
  if(!confirm('취소된 주문을 대기 상태로 복구할까요? 장부 금액도 복구됩니다.'))return;
  const order=Object.values(orders).find(o=>String(o.id)===String(id));
  db.ref('orders/'+id+'/status').set('pending');
  if(order)restoreInLedger(order);
  document.getElementById('detailOverlay').style.display='none';
}
// 완료건 취소 — 완료 → 취소
function cancelCompletedOrder(id){
  if(!confirm('완료된 주문을 취소 처리할까요? 장부 금액이 0으로 변경됩니다.'))return;
  const order=Object.values(orders).find(o=>String(o.id)===String(id));
  db.ref('orders/'+id+'/status').set('cancelled');
  if(order)markCancelledInLedger(order);
  document.getElementById('detailOverlay').style.display='none';
}
// 세부 음료 제조완료 토글
function toggleMade(orderId,itemIdx){
  const key=orderId+'_'+itemIdx;
  if(madeItems[key])delete madeItems[key];
  else madeItems[key]=true;
  // 해당 카드만 업데이트
  renderOrders();
}

// 태그 HTML
function tempTag(temp){
  if(!temp)return'';
  if(temp==='HOT')return'<span class="tag tag-hot">HOT</span>';
  if(temp==='ICE')return'<span class="tag tag-ice">ICE</span>';
  return'';
}
function isMega(name){return /메가|왕/.test(name);}

// 날짜 포맷
function fmtDate(ts){
  const d=new Date(ts);
  return `${d.getMonth()+1}/${d.getDate()}`;
}
function fmtDateFull(ts){
  const d=new Date(ts);
  const days=['일','월','화','수','목','금','토'];
  return `${d.getMonth()+1}월 ${d.getDate()}일 (${days[d.getDay()]})`;
}

const PAGE_SIZE=4; // 항상 1×4 고정
let currentPage=1;
let swipeStartX=0, swipeStartY=0, isSwiping=false;

// ── 드래그 스와이프 ──
function initSwipe(){
  const track=document.getElementById('slideTrack');
  if(!track)return;
  track.addEventListener('touchstart',e=>{
    swipeStartX=e.touches[0].clientX;
    swipeStartY=e.touches[0].clientY;
    isSwiping=true;
  },{passive:true});
  track.addEventListener('touchend',e=>{
    if(!isSwiping)return;
    isSwiping=false;
    const dx=e.changedTouches[0].clientX-swipeStartX;
    const dy=e.changedTouches[0].clientY-swipeStartY;
    if(Math.abs(dx)>Math.abs(dy)&&Math.abs(dx)>40){
      if(dx<0)changePage(1);
      else changePage(-1);
    }
  },{passive:true});
  // 마우스 드래그 (PC)
  let mouseDown=false,mouseStartX=0;
  track.addEventListener('mousedown',e=>{mouseDown=true;mouseStartX=e.clientX;});
  track.addEventListener('mouseup',e=>{
    if(!mouseDown)return;
    mouseDown=false;
    const dx=e.clientX-mouseStartX;
    if(Math.abs(dx)>40){
      if(dx<0)changePage(1);
      else changePage(-1);
    }
  });
}

// 렌더
function renderOrders(){
  const pending=Object.values(orders).filter(o=>o.status==='pending');
  const done=Object.values(orders).filter(o=>o.status==='done');
  const cancelled=Object.values(orders).filter(o=>o.status==='cancelled');
  const urgent=pending.filter(o=>isUrgent(o.createdAt));

  document.getElementById('topCount').textContent='대기 '+pending.length+'건';
  document.getElementById('statPending').textContent=pending.length+'건';
  document.getElementById('statDone').textContent=done.length+'건';
  document.getElementById('statUrgent').textContent=urgent.length+'건';

  const fullList=Object.values(orders)
    .filter(o=>showDone?(o.status==='done'||o.status==='cancelled'):o.status==='pending')
    .sort((a,b)=>showDone?b.createdAt-a.createdAt:a.createdAt-b.createdAt);

  const sliderWrap=document.getElementById('sliderWrap');
  const emptyState=document.getElementById('emptyState');
  const orderGrid=document.getElementById('orderGrid');

  // 완료/취소 내역 모드 — 기존 스크롤 그리드
  if(showDone){
    sliderWrap.style.display='none';
    emptyState.style.display='none';
    orderGrid.style.display='grid';
    orderGrid.innerHTML='';
    if(fullList.length===0){
      orderGrid.innerHTML='<div class="empty-state" style="grid-column:1/-1;"><div class="empty-icon">📋</div><div class="empty-text">완료/취소 내역이 없어요</div></div>';
      return;
    }
    let lastDate='';
    fullList.forEach(order=>{
      const isDone=order.status==='done';
      const isCancelled=order.status==='cancelled';
      if(showDone){
        const dateStr=fmtDate(order.createdAt);
        if(dateStr!==lastDate){
          lastDate=dateStr;
          const divider=document.createElement('div');
          divider.className='date-divider';
          divider.textContent='📅 '+fmtDateFull(order.createdAt);
          orderGrid.appendChild(divider);
        }
      }
      const card=makeCard(order,isDone,isCancelled,false);
      orderGrid.appendChild(card);
    });
    return;
  }

  // 대기 주문 모드 — 슬라이드 페이지
  orderGrid.style.display='none';
  if(fullList.length===0){
    sliderWrap.style.display='none';
    emptyState.style.display='flex';
    emptyState.querySelector('.empty-text').textContent='주문을 기다리는 중...';
    return;
  }
  emptyState.style.display='none';
  sliderWrap.style.display='flex';

  const totalPages=Math.max(1,Math.ceil(fullList.length/PAGE_SIZE));
  if(currentPage>totalPages)currentPage=totalPages;
  document.getElementById('pageIndicator').textContent=currentPage+' / '+totalPages;

  const track=document.getElementById('slideTrack');
  track.innerHTML='';
  track.style.transition='none';
  track.style.transform='translateX(-'+(currentPage-1)*100+'%)';

  // 슬라이드 페이지 생성
  for(let p=0;p<totalPages;p++){
    const page=document.createElement('div');
    page.className='slide-page';
    const pageOrders=fullList.slice(p*PAGE_SIZE,(p+1)*PAGE_SIZE);
    pageOrders.forEach(order=>{
      const isDone=order.status==='done';
      const isCancelled=order.status==='cancelled';
      const card=makeCard(order,isDone,isCancelled,true);
      page.appendChild(card);
    });
    track.appendChild(page);
  }

  if(fullList.length===0){
    sliderWrap.style.display='none';
    emptyState.style.display='flex';
    return;
  }


}

// ── 카드 생성 공통 함수 ──
function makeCard(order,isDone,isCancelled,isPending){
  const urg=isPending&&!isDone&&!isCancelled&&isUrgent(order.createdAt);
  const card=document.createElement('div');
  card.className='order-card'+(urg?' urgent':isDone?' done':isCancelled?' cancelled':'');

  const headCls='card-head'+(urg?' urgent':isDone?' done':isCancelled?' cancelled':'');
  const time=new Date(order.createdAt);
  const timeStr=String(time.getHours()).padStart(2,'0')+':'+String(time.getMinutes()).padStart(2,'0');
  const isTake=order.orderType==='take';
  const typeBadge=`<span class="type-badge ${isTake?'type-take':'type-eat'}">${isTake?'🛍️ 포장':'🍽️ 매장'}</span>`;

  const headDiv=document.createElement('div');
  headDiv.className=headCls;
  headDiv.innerHTML=`
    <div>
      <div class="order-no">#${String(order.id).padStart(3,'0')}</div>
      <div class="order-dept">${esc(order.deptName)}</div>
      ${typeBadge}
    </div>
    <div class="head-right">
      ${urg?'<span class="urgent-badge">⚠ 5분초과</span>':''}
      ${isCancelled?'<span style="font-size:9px;background:#999;color:#fff;padding:2px 6px;border-radius:3px;font-weight:500;">취소됨</span>':''}
      <span class="order-time">${timeStr}</span>
    </div>`;
  card.appendChild(headDiv);

  const body=document.createElement('div');
  body.className='card-body';
  body.style.cssText='overflow-y:auto;flex:1;';
  (order.items||[]).forEach((item,idx)=>{
    const mega=isMega(item.name);
    const optStr=(item.opts||[]).map(o=>o.name).join(', ');
    const madeKey=order.id+'_'+idx;
    const isMade=!!madeItems[madeKey];
    const div=document.createElement('div');
    div.className='menu-item'+(isMade?' made':'');
    if(isPending&&!isDone&&!isCancelled){
      div.onclick=()=>toggleMade(order.id,idx);
      div.title='터치하면 제조완료 표시';
    }
    div.innerHTML=`
      <div class="menu-row">
        <span class="menu-name">${esc(item.displayName||item.name)}${mega?'<span class="tag tag-mega">MEGA</span>':''}${tempTag(item.temp)}</span>
        <span class="menu-qty">${isMade?'✓':''}x${item.qty}</span>
      </div>
      ${optStr?`<div class="opt-row"><span class="opt-arrow">▶</span><span class="opt-text">${esc(optStr)}</span></div>`:''}`;
    body.appendChild(div);
  });
  card.appendChild(body);

  const foot=document.createElement('div');
  foot.className='card-foot';
  if(isPending&&!isDone&&!isCancelled){
    const elapsed=document.createElement('div');
    elapsed.className='elapsed'+(urg?' warn':'');
    elapsed.textContent=getElapsed(order.createdAt);
    foot.appendChild(elapsed);

    const btnRow=document.createElement('div');
    btnRow.style.cssText='display:flex;gap:5px;';

    const doneBtn=document.createElement('button');
    doneBtn.className='done-btn';
    doneBtn.style.flex='1';
    doneBtn.textContent='✓ 완료';
    doneBtn.onclick=()=>completeOrder(order.id);
    btnRow.appendChild(doneBtn);

    const cancelBtn=document.createElement('button');
    cancelBtn.className='cancel-btn';
    cancelBtn.style.cssText='flex:0.5;margin-top:0;';
    cancelBtn.textContent='✕ 취소';
    cancelBtn.onclick=(e)=>{e.stopPropagation();cancelOrder(order.id);};
    btnRow.appendChild(cancelBtn);

    foot.appendChild(btnRow);
  } else {
    const btn=document.createElement('button');
    btn.className='done-btn completed';
    btn.textContent=isCancelled?'✕ 취소됨':'✓ 완료됨';
    foot.appendChild(btn);
    card.style.cursor='pointer';
    card.onclick=()=>openDetail(order);
  }
  card.appendChild(foot);
  return card;
}

function changePage(dir){
  const pending=Object.values(orders).filter(o=>o.status==='pending');
  const totalPages=Math.max(1,Math.ceil(pending.length/PAGE_SIZE));
  const newPage=currentPage+dir;
  if(newPage<1||newPage>totalPages)return;
  currentPage=newPage;
  document.getElementById('pageIndicator').textContent=currentPage+' / '+totalPages;
  const track=document.getElementById('slideTrack');
  track.style.transition='transform 0.3s ease';
  track.style.transform='translateX(-'+(currentPage-1)*100+'%)';
}

// 상세 팝업
function openDetail(order){
  const isTake=order.orderType==='take';
  const isCancelled=order.status==='cancelled';
  const time=new Date(order.createdAt);
  const timeStr=`${time.getMonth()+1}/${time.getDate()} ${String(time.getHours()).padStart(2,'0')}:${String(time.getMinutes()).padStart(2,'0')}`;

  document.getElementById('detailTitle').textContent=
    `#${String(order.id).padStart(3,'0')} ${esc(order.deptName)}`;

  let html=`<div class="detail-meta">
    <div class="detail-meta-row"><span class="detail-meta-label">주문시간</span><span class="detail-meta-val">${timeStr}</span></div>
    <div class="detail-meta-row"><span class="detail-meta-label">유형</span><span class="detail-meta-val">${isTake?'🛍️ 포장':'🍽️ 매장'}</span></div>
    <div class="detail-meta-row"><span class="detail-meta-label">상태</span><span class="detail-meta-val">${isCancelled?'❌ 취소됨':'✅ 완료됨'}</span></div>
  </div>
  <hr class="detail-hr">
  <div class="detail-items-title">주문 내역 (${(order.items||[]).length}종)</div>`;

  (order.items||[]).forEach(item=>{
    const mega=isMega(item.name);
    const optStr=(item.opts||[]).map(o=>o.name).join(' · ');
    html+=`<div class="detail-item">
      <div class="detail-item-name">
        ${esc(item.displayName||item.name)}
        ${mega?'<span class="tag tag-mega">MEGA</span>':''}
        ${tempTag(item.temp)}
        <span style="margin-left:auto;font-size:13px;font-weight:700;">×${item.qty}</span>
      </div>
      ${optStr?`<div class="detail-item-opt">▶ ${esc(optStr)}</div>`:''}
    </div>`;
  });

  // 취소 복구 버튼 (취소된 주문만)
  if(isCancelled){
    html+=`<button onclick="restoreOrder('${order.id}')" style="width:100%;margin-top:10px;padding:10px;background:#FFF3CD;border:1.5px solid #E8D84A;border-radius:8px;font-size:13px;font-weight:500;color:#2C2C2A;cursor:pointer;">↩ 취소 복구 (대기 상태로 되돌리기)</button>`;
  } else {
    html+=`<button onclick="cancelCompletedOrder('${order.id}')" style="width:100%;margin-top:10px;padding:10px;background:#fce8e8;border:1.5px solid #f0c0c0;border-radius:8px;font-size:13px;font-weight:500;color:#993C1D;cursor:pointer;">✕ 완료 취소 (취소 처리하기)</button>`;
  }

  document.getElementById('detailBody').innerHTML=html;
  document.getElementById('detailOverlay').style.display='flex';
}

function closeDetail(e){
  if(e.target===document.getElementById('detailOverlay')){
    document.getElementById('detailOverlay').style.display='none';
  }
}

// 경과시간 1초마다 갱신
setInterval(()=>{
  document.querySelectorAll('.elapsed').forEach(el=>{
    const card=el.closest('.order-card');
    if(!card||card.classList.contains('done'))return;
    const id=card.querySelector('.order-no')?.textContent?.replace('#','');
    if(!id)return;
    const order=Object.values(orders).find(o=>String(o.id).padStart(3,'0')===id);
    if(!order)return;
    const urg=isUrgent(order.createdAt);
    el.textContent=getElapsed(order.createdAt);
    el.className='elapsed'+(urg?' warn':'');
    if(urg){card.className='order-card urgent';}
  });
},1000);

function toggleDone(){
  showDone=!showDone;
  currentPage=1;
  document.getElementById('showDoneBtn').textContent=showDone?'완료/취소 내역 숨기기':'완료/취소 내역 보기';
  renderOrders();
}

function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');}

listenOrders();
initSwipe();
</script>
